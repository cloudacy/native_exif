name: native_exif_example
description: Demonstrates how to use the native_exif plugin.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '^3.3.0'

dependencies:
  flutter:
    sdk: flutter

  native_exif:
    path: ../

  cupertino_icons: ^1.0.8

  image_picker: ^1.2.1

  intl: any

  path: ^1.9.1

  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
